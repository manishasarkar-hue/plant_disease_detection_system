<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_2 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_2" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_2');
  if (!container) return;
  
  const scene = new THREE.Scene();
  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || window.innerHeight;
  const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  // --- Lighting Setup ---
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
  scene.add(ambientLight);

  const mainLight = new THREE.DirectionalLight(0xffffff, 1.4);
  mainLight.position.set(4, 7, 5);
  scene.add(mainLight);

  // Rim Light for glowing leaf contour
  const rimLight = new THREE.DirectionalLight(0x99e28d, 1.8);
  rimLight.position.set(-5, 4, -4);
  scene.add(rimLight);

  const fillLight = new THREE.PointLight(0x2D5A27, 1.5, 10);
  fillLight.position.set(0, -1, 3);
  scene.add(fillLight);

  // --- Procedural Hyper-Realistic Leaf Color Texture ---
  function createHyperRealisticLeafTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 1024;
    canvas.height = 2048;
    const ctx = canvas.getContext('2d');

    // 1. Base Leaf Chlorophyll Gradient
    const grad = ctx.createLinearGradient(0, 0, 0, 2048);
    grad.addColorStop(0, '#4A8F40');    // Fresh green tip
    grad.addColorStop(0.3, '#336B2B');  // Saturated middle
    grad.addColorStop(0.7, '#244F1D');  // Rich forest green lower body
    grad.addColorStop(1, '#1A3B14');    // Dark base
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 1024, 2048);

    // Subtle organic cellular noise
    for (let i = 0; i < 3500; i++) {
      const rx = Math.random() * 1024;
      const ry = Math.random() * 2048;
      ctx.fillStyle = Math.random() > 0.5 ? 'rgba(110, 185, 95, 0.04)' : 'rgba(15, 35, 12, 0.04)';
      ctx.beginPath();
      ctx.arc(rx, ry, Math.random() * 12 + 4, 0, Math.PI * 2);
      ctx.fill();
    }

    // 2. Central Midrib (Tapering from stem base to tip)
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#8ED378';
    ctx.lineWidth = 18;
    ctx.beginPath();
    ctx.moveTo(512, 1980);
    ctx.quadraticCurveTo(515, 1000, 512, 80);
    ctx.stroke();

    // 3. Secondary Veins (14 pairs with realistic curvature)
    const veinCount = 14;
    for (let i = 1; i <= veinCount; i++) {
      const progress = i / (veinCount + 1);
      const y = 1900 - progress * 1750;
      const lineWidth = Math.max(3, 10 * (1 - progress * 0.6));
      
      ctx.strokeStyle = 'rgba(142, 211, 120, 0.65)';
      ctx.lineWidth = lineWidth;

      // Right Vein
      ctx.beginPath();
      ctx.moveTo(512, y);
      ctx.quadraticCurveTo(720, y - 60, 960, y - 140);
      ctx.stroke();

      // Left Vein
      ctx.beginPath();
      ctx.moveTo(512, y);
      ctx.quadraticCurveTo(304, y - 60, 64, y - 140);
      ctx.stroke();

      // 4. Tertiary Sub-Veins (Micro capillary mesh between secondary veins)
      ctx.strokeStyle = 'rgba(142, 211, 120, 0.25)';
      ctx.lineWidth = 1.8;
      for (let j = 0; j < 5; j++) {
        const subY = y - j * 12;
        // Right micro vein
        ctx.beginPath();
        ctx.moveTo(512 + j * 70, subY - 15);
        ctx.lineTo(512 + j * 70 + 40, subY + 30);
        ctx.stroke();

        // Left micro vein
        ctx.beginPath();
        ctx.moveTo(512 - j * 70, subY - 15);
        ctx.lineTo(512 - j * 70 - 40, subY + 30);
        ctx.stroke();
      }
    }

    const texture = new THREE.CanvasTexture(canvas);
    return texture;
  }

  // --- Procedural Leaf Bump / Normal Map for 3D Surface Relief ---
  function createLeafBumpMap() {
    const canvas = document.createElement('canvas');
    canvas.width = 1024;
    canvas.height = 2048;
    const ctx = canvas.getContext('2d');

    // Neutral gray base
    ctx.fillStyle = '#808080';
    ctx.fillRect(0, 0, 1024, 2048);

    // Raised Midrib
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 22;
    ctx.beginPath();
    ctx.moveTo(512, 1980);
    ctx.quadraticCurveTo(515, 1000, 512, 80);
    ctx.stroke();

    // Raised Secondary Veins
    ctx.strokeStyle = '#d0d0d0';
    ctx.lineWidth = 10;
    const veinCount = 14;
    for (let i = 1; i <= veinCount; i++) {
      const progress = i / (veinCount + 1);
      const y = 1900 - progress * 1750;

      // Right Vein
      ctx.beginPath();
      ctx.moveTo(512, y);
      ctx.quadraticCurveTo(720, y - 60, 960, y - 140);
      ctx.stroke();

      // Left Vein
      ctx.beginPath();
      ctx.moveTo(512, y);
      ctx.quadraticCurveTo(304, y - 60, 64, y - 140);
      ctx.stroke();
    }

    return new THREE.CanvasTexture(canvas);
  }

  const leafGroup = new THREE.Group();
  scene.add(leafGroup);

  // --- Organic Serrated 3D Leaf Geometry ---
  const leafShape = new THREE.Shape();
  leafShape.moveTo(0, -0.5);

  // Right side with organic serrated edge teeth
  const rightPoints = [
    [0.4, 0.0], [0.35, 0.1], [0.7, 0.4], [0.65, 0.5],
    [1.0, 0.9], [0.95, 1.0], [1.25, 1.5], [1.2, 1.6],
    [1.3, 2.2], [1.22, 2.3], [1.1, 2.8], [1.02, 2.9],
    [0.8, 3.4], [0.72, 3.5], [0.4, 4.0], [0.35, 4.05], [0, 4.6]
  ];
  rightPoints.forEach(([px, py]) => leafShape.lineTo(px, py));

  // Left side with organic serrated edge teeth
  const leftPoints = [
    [-0.35, 4.05], [-0.4, 4.0], [-0.72, 3.5], [-0.8, 3.4],
    [-1.02, 2.9], [-1.1, 2.8], [-1.22, 2.3], [-1.3, 2.2],
    [-1.2, 1.6], [-1.25, 1.5], [-0.95, 1.0], [-1.0, 0.9],
    [-0.65, 0.5], [-0.7, 0.4], [-0.35, 0.1], [-0.4, 0.0], [0, -0.5]
  ];
  leftPoints.forEach(([px, py]) => leafShape.lineTo(px, py));

  const extrudeSettings = {
    depth: 0.06,
    bevelEnabled: true,
    bevelThickness: 0.03,
    bevelSize: 0.04,
    bevelSegments: 5
  };

  const leafGeom = new THREE.ExtrudeGeometry(leafShape, extrudeSettings);
  
  // Apply natural 3D organic leaf curvature:
  // Transverse cup folding inward + Longitudinal arching
  const posAttr = leafGeom.attributes.position;
  for (let i = 0; i < posAttr.count; i++) {
    const x = posAttr.getX(i);
    const y = posAttr.getY(i);
    const z = posAttr.getZ(i);

    const cupZ = Math.pow(Math.abs(x), 1.4) * -0.18;
    const archZ = Math.sin((y / 4.6) * Math.PI) * 0.22;

    posAttr.setZ(i, z + cupZ + archZ);
  }
  leafGeom.computeVertexNormals();

  const leafTexture = createHyperRealisticLeafTexture();
  const bumpTexture = createLeafBumpMap();

  const leafMat = new THREE.MeshStandardMaterial({
    map: leafTexture,
    bumpMap: bumpTexture,
    bumpScale: 0.07,
    roughness: 0.24,
    metalness: 0.03,
    side: THREE.DoubleSide
  });

  const leafMesh = new THREE.Mesh(leafGeom, leafMat);
  leafGroup.add(leafMesh);

  // --- 3D Tapered Central Midrib ---
  const midribCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, -0.5, 0.04),
    new THREE.Vector3(0, 1.5, 0.18),
    new THREE.Vector3(0, 3.2, 0.16),
    new THREE.Vector3(0, 4.6, 0.02)
  ]);
  const midribGeom = new THREE.TubeGeometry(midribCurve, 32, 0.038, 12, false);
  const midribMat = new THREE.MeshStandardMaterial({ color: 0x78BC66, roughness: 0.3 });
  const midrib = new THREE.Mesh(midribGeom, midribMat);
  leafGroup.add(midrib);

  // --- 3D Curved Stem Petiole ---
  const petioleCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, -1.3, -0.2),
    new THREE.Vector3(0, -0.9, -0.1),
    new THREE.Vector3(0, -0.5, 0.02)
  ]);
  const petioleGeom = new THREE.TubeGeometry(petioleCurve, 16, 0.045, 12, false);
  const petioleMat = new THREE.MeshStandardMaterial({ color: 0x336B2B, roughness: 0.4 });
  const petiole = new THREE.Mesh(petioleGeom, petioleMat);
  leafGroup.add(petiole);

  // Center & Tilt single leaf
  leafGroup.position.set(0, -2.1, 0);
  leafGroup.rotation.z = -0.12;
  leafGroup.rotation.y = 0.15;

  // --- Floating Ambient Spores ---
  const particleCount = 45;
  const particleGeom = new THREE.BufferGeometry();
  const particlePositions = new Float32Array(particleCount * 3);
  const particlePhases = [];

  for (let i = 0; i < particleCount; i++) {
    particlePositions[i * 3] = (Math.random() - 0.5) * 6;
    particlePositions[i * 3 + 1] = (Math.random() - 0.5) * 6;
    particlePositions[i * 3 + 2] = (Math.random() - 0.5) * 4;
    particlePhases.push(Math.random() * Math.PI * 2);
  }

  particleGeom.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
  
  const particleMat = new THREE.PointsMaterial({
    color: 0xa1d494,
    size: 0.08,
    transparent: true,
    opacity: 0.65
  });

  const particles = new THREE.Points(particleGeom, particleMat);
  scene.add(particles);

  // Camera Settings
  camera.position.set(0, 0.2, 8.4);

  // Mouse Interactivity
  let mouseX = 0;
  let mouseY = 0;
  let targetX = 0;
  let targetY = 0;

  window.addEventListener('mousemove', (event) => {
    mouseX = (event.clientX / window.innerWidth) - 0.5;
    mouseY = (event.clientY / window.innerHeight) - 0.5;
  });

  window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });

  // Animation Loop
  let time = 0;
  function animate() {
    requestAnimationFrame(animate);
    time += 0.015;

    // Smooth Mouse Rotation
    targetX += (mouseX - targetX) * 0.04;
    targetY += (mouseY - targetY) * 0.04;

    leafGroup.rotation.y = 0.15 + targetX * 0.5;
    leafGroup.rotation.x = targetY * 0.3;

    // Gentle Floating Motion
    leafGroup.position.y = -2.1 + Math.sin(time * 0.9) * 0.12;

    // Particles Float
    const positions = particles.geometry.attributes.position.array;
    for (let i = 0; i < particleCount; i++) {
      positions[i * 3 + 1] += Math.sin(time + particlePhases[i]) * 0.003 + 0.002;
      if (positions[i * 3 + 1] > 3.5) {
        positions[i * 3 + 1] = -3.5;
      }
    }
    particles.geometry.attributes.position.needsUpdate = true;

    renderer.render(scene, camera);
  }

  animate();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_2 -->
</body>
</html>
