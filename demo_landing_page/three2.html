<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_3 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_3" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_3');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js Scene: CTA Floating Plant
// A minimal, elegant 3D plant structure for the final CTA section

const scene = new THREE.Scene();
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });

renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 1);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0xffffff, 1);
pointLight.position.set(5, 5, 5);
scene.add(pointLight);

// Simple abstract plant (multiple leaves)
const plantGroup = new THREE.Group();

function createLeaf(angle, scale) {
    const leafShape = new THREE.Shape();
    leafShape.moveTo(0, 0);
    leafShape.bezierCurveTo(1, 1, 1, 2, 0, 3);
    leafShape.bezierCurveTo(-1, 2, -1, 1, 0, 0);
    
    const geom = new THREE.ShapeGeometry(leafShape);
    const mat = new THREE.MeshPhongMaterial({ 
        color: 0x2D5A27, 
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.9
    });
    
    const leaf = new THREE.Mesh(geom, mat);
    leaf.rotation.z = angle;
    leaf.scale.set(scale, scale, scale);
    return leaf;
}

for (let i = 0; i < 5; i++) {
    const leaf = createLeaf((i / 5) * Math.PI * 2, 0.8 + Math.random() * 0.4);
    leaf.rotation.x = Math.random() * 0.5;
    plantGroup.add(leaf);
}

scene.add(plantGroup);

camera.position.z = 5;

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

function animate() {
    requestAnimationFrame(animate);
    
    plantGroup.rotation.y += 0.005;
    plantGroup.position.y = Math.sin(Date.now() * 0.001) * 0.1;
    
    renderer.render(scene, camera);
}

animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_3 -->
</body>
</html>
